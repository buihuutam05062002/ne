<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NECLATCLOSED — Khai thác</title>
    <link rel="stylesheet" href="../static/css/miningView.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Khai thác hành vi khách hàng</span>
        <span class="algo-badge">NECLATCLOSED</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div class="status-dot idle" id="statusDot">
          <span class="dot"></span>
          <span id="statusText">Chưa khai thác</span>
        </div>
        <a href="./recommendView.html" class="nav-btn"> Gợi ý sản phẩm </a>
      </div>
    </header>

    <div class="toolbar">
      <div class="field">
        <label for="transactionFile">File giao dịch (.txt)</label>
        <input type="file" id="transactionFile" accept=".txt" />
      </div>
      <div class="field">
        <label for="minSupport">Ngưỡng min support</label>
        <input type="text" id="minSupport" placeholder="Ví dụ: 0.02" />
      </div>
      <button class="btn-run" id="btnRun" onclick="sendData()">
        Khai thác tập mục phổ biến đóng
      </button>
    </div>

    <div class="page-body">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Danh sách sản phẩm</div>
          <input
            class="sidebar-search"
            type="text"
            id="sidebarSearch"
            placeholder="Tìm sản phẩm..."
            oninput="filterSidebar()"
          />
        </div>
        <div class="sidebar-legend">
          <div class="legend-item">
            <div class="legend-dot active"></div>
            Xuất hiện trong kết quả
          </div>
          <div class="legend-item">
            <div class="legend-dot inactive"></div>
            Không xuất hiện
          </div>
        </div>
        <ul id="sidebarList">
          <li class="sidebar-empty">Đang tải sản phẩm...</li>
        </ul>
      </div>

      <div class="main-content">
        <div class="stats-grid">
          <div class="stat-card c-blue">
            <div class="stat-label">Số giao dịch</div>
            <div class="stat-val" id="statTrans">—</div>
          </div>
          <div class="stat-card c-green">
            <div class="stat-label">Frequent 1-itemset</div>
            <div class="stat-val" id="stat1Item">—</div>
          </div>
          <div class="stat-card c-yellow">
            <div class="stat-label">Closed itemset</div>
            <div class="stat-val" id="statClosed">—</div>
          </div>
        </div>

        <div class="result-wrap">
          <div class="result-panel">
            <div class="result-header">
              <span class="result-title">Kết quả khai thác</span>
              <div class="result-actions">
                <input
                  class="filter-input"
                  type="text"
                  id="filterInput"
                  placeholder="Lọc tập mục..."
                  oninput="filterTable()"
                />
                <button
                  class="sort-btn active"
                  id="sortBtn"
                  onclick="toggleSort()"
                >
                  <span id="sortLabel">Support ↓</span>
                </button>
                <button class="export-btn" onclick="exportCSV()">
                  Xuất CSV
                </button>
              </div>
            </div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th class="td-num">#</th>
                    <th onclick="sortByCol('items')">
                      Tập mục <span style="opacity: 0.5">↕</span>
                    </th>
                    <th class="td-sup sorted" onclick="sortByCol('support')">
                      Support <span style="opacity: 0.5">↓</span>
                    </th>
                  </tr>
                </thead>
                <tbody id="itemsetBody">
                  <tr>
                    <td colspan="3">
                      <div class="empty-state">
                        Chọn file và nhập min support để bắt đầu
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="toastContainer"></div>

    <script src="../static/js/miningView.js"></script>
  </body>
</html>
