<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" />
    <title>Document</title>
  </head>
  <body>
    <div
      class="d-flex flex-row justify-content-between align-items-center w-100 p-3 border-bottom bg"
    >
      <div class="d-flex flex-row align-items-center gap-3">
        <p class="mb-0" style="font-weight: 700">
          Khai thác hành vi khách hàng
        </p>
        <span class="bg-success text-light p-2 border rounded-5"
          >NECLATCLOSED</span
        >
      </div>
      <span class="">
        <a href="./recommendView.html" class="btn btn-outline-secondary btn-sm">
          Gợi ý sản phẩm ->
        </a>
      </span>
    </div>
    <div class="row justify-content-around align-items-center g-3 px-3 w-100">
      <div class="col-3">
        <label for="transactionFile">Chọn file giao dịch (.txt)</label>
        <input
          type="file"
          name="transactionFile"
          id="transactionFile"
          class="form-control form-control-sm"
          style="width: 200px"
        />
      </div>
      <div class="col-6">
        <label for="minSupport">Min support</label>
        <input
          type="text"
          name="minSupport"
          id="minSupport"
          class="form-control form-control-sm"
          style="width: 50em"
        />
      </div>
      <div class="col-3">
        <button
          type="button"
          class="btn btn-primary w-100"
          onclick="sendData()"
        >
          Khai thác tập mục phổ biến đóng
        </button>
      </div>
    </div>
    <!-- Thống kê -->
    <div id="statsSection" class="container-fluid px-3 mt-3">
      <div class="row g-3">
        <div class="col">
          <div class="border rounded p-3 text-center">
            <div class="text-secondary" style="font-size: 13px">
              Số giao dịch
            </div>
            <div class="fw-bold fs-5" id="statTrans"></div>
          </div>
        </div>
        <div class="col">
          <div class="border rounded p-3 text-center">
            <div class="text-secondary" style="font-size: 13px">
              Frequent 1-itemset
            </div>
            <div class="fw-bold fs-5" id="stat1Item"></div>
          </div>
        </div>
        <div class="col">
          <div class="border rounded p-3 text-center">
            <div class="text-secondary" style="font-size: 13px">
              Closed itemset
            </div>
            <div class="fw-bold fs-5" id="statClosed"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="container-fluid px-3 mt-3">
      <div id="resultSection" style="display: none">
        <h6 class="fw-bold">Kết quả khai thác:</h6>
        <div
          id="itemsetTable"
          class="table-responsive"
          style="max-height: 500px; overflow-y: auto"
        >
          <table class="table table-sm table-bordered table-striped">
            <thead class="table-dark sticky-top">
              <tr>
                <th>#</th>
                <th>Tập mục</th>
                <th>Support</th>
              </tr>
            </thead>
            <tbody id="itemsetBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="../static/js/app1.js"></script>
  </body>
</html>
