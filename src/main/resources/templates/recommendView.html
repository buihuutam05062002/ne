<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>NECLATCLOSED — Gợi ý sản phẩm</title>
      <link rel="stylesheet" href="../static/css/recommendView.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <a href="./miningView.html" class="nav-btn"> ◂ Khai thác lại </a>
        <span class="topbar-title">Hệ thống gợi ý sản phẩm</span>
        <span class="algo-badge">NECLATCLOSED</span>
      </div>
    </header>

    <div class="main">
      <div class="col-list">
        <div class="col-header">
          <div class="col-title">Sản phẩm</div>
          <div class="col-sub" id="productCount">Đang tải...</div>
        </div>
        <div class="search-wrap">
          <input
            type="text"
            id="searchInput"
            placeholder="Tìm sản phẩm..."
            oninput="filterProducts()"
            disabled
          />
        </div>
        <ul id="productList">
          <li style="padding: 12px 14px">
            <div class="skeleton skel-name" style="width: 80%"></div>
            <div class="skeleton skel-name" style="width: 60%"></div>
            <div class="skeleton skel-name" style="width: 70%"></div>
          </li>
        </ul>
      </div>

      <div class="col-detail">
        <div class="col-header">
          <div class="col-title">Thông tin sản phẩm</div>
        </div>
        <div id="detailBody">
          <div class="empty-msg">Chọn sản phẩm để xem chi tiết</div>
        </div>
        <div class="detail-footer">
          <button
            id="btnAddBasket"
            class="btn-basket add"
            style="display: none"
            onclick="onToggleBasket()"
          >
            Thêm vào giỏ hàng
          </button>
        </div>
      </div>

      <div class="col-right">
        <div class="basket-section">
          <div class="section-label">Giỏ hàng</div>
          <div id="basket">
            <span
              style="font-size: 12px; color: var(--muted); font-style: italic"
              >Chưa chọn sản phẩm nào</span
            >
          </div>
        </div>

        <div class="rec-section">
          <div class="rec-header">
            <span class="rec-title">Gợi ý sản phẩm</span>
            <span
              class="rec-count-badge"
              id="recCount"
              style="display: none"
            ></span>
          </div>
          <div id="recArea">
            <div class="empty-msg">Chọn sản phẩm để xem gợi ý</div>
          </div>
        </div>
      </div>
    </div>

    <template id="tplProduct">
      <li class="p-item">
        <div class="p-check">✓</div>
        <span class="p-name"></span>
      </li>
    </template>
    <template id="tplChip">
      <div class="chip">
        <span class="b-name"></span>
        <button type="button" class="chip-rm b-rm">✕</button>
      </div>
    </template>

    <div id="toastContainer"></div>

    <script src="../static/js/recommendView.js"></script>
  </body>
</html>
