<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" />
    <title>NECLATCLOSED</title>
  </head>

  <body class="bg-light">

    <div class="d-flex align-items-center gap-3 p-3 bg-white border-bottom">
      <a href="miningView.html" class="btn btn-outline-secondary btn-sm">← Khai thác lại</a>
      <span class="fw-bold">Hệ thống gợi ý sản phẩm</span>
      <span class="badge bg-success">NECLATCLOSED</span>
    </div>


    <div class="d-flex" style="height: calc(100vh - 57px); overflow: hidden;">


      <div class="d-flex flex-column bg-white border-end" style="width: 260px; min-width: 220px;">
        <div class="p-2 border-bottom">
          <div class="fw-semibold" style="font-size:13px;">Danh sách sản phẩm</div>
          <div id="productCount" class="text-secondary" style="font-size:12px;">Đang tải...</div>
        </div>
        <div class="p-2 border-bottom">
          <input type="text" id="searchInput" class="form-control form-control-sm"
            placeholder="Tìm sản phẩm..." oninput="filterProducts()" disabled />
        </div>
        <ul id="productList" class="list-unstyled m-0 overflow-auto flex-grow-1">
          <li class="text-secondary text-center mt-3" style="font-size:13px;">Khai thác trước</li>
        </ul>
      </div>

      <div class="d-flex flex-column bg-white border-end" style="width: 300px; min-width: 260px;">
        <div class="p-2 border-bottom fw-semibold" style="font-size:13px;">Thông tin sản phẩm</div>
        <div id="detailBody" class="p-3 overflow-auto flex-grow-1">
          <p class="text-secondary text-center mt-4" style="font-size:13px;">Chọn sản phẩm để xem chi tiết</p>
        </div>
        <div class="p-2 border-top">
          <button id="btnAddBasket" class="btn btn-success btn-sm w-100" style="display:none;" onclick="onToggleBasket()">
            Thêm vào giỏ hàng
          </button>
        </div>
      </div>

      <div class="d-flex flex-column flex-grow-1 p-3 gap-3 overflow-hidden">


        <div class="bg-white border rounded p-3">
          <div class="text-secondary mb-2" style="font-size:13px;">Giỏ hàng</div>
          <div id="basket" class="d-flex flex-wrap gap-2">
            <span class="text-secondary fst-italic" style="font-size:13px;">Chưa chọn sản phẩm nào</span>
          </div>
        </div>

        <div class="bg-white border rounded d-flex flex-column flex-grow-1 overflow-hidden">
          <div class="p-3 border-bottom d-flex align-items-center gap-2">
            <span class="fw-semibold">Gợi ý sản phẩm</span>
            <span class="text-secondary" id="recCount" style="font-size:13px;"></span>
          </div>
          <div id="recArea" class="overflow-auto flex-grow-1">
            <p class="text-secondary text-center mt-4" style="font-size:13px;">Chọn sản phẩm để xem gợi ý</p>
          </div>
        </div>

      </div>
    </div>

    <template id="tplProduct">
      <li class="p-item d-flex align-items-center px-3 py-2 border-bottom"
          style="cursor:pointer; font-size:13px; border-left: 3px solid transparent;">
        <span class="p-check text-success fw-bold me-2" style="opacity:0;">+</span>
        <span class="p-name"></span>
      </li>
    </template>

    <template id="tplChip">
      <div class="badge bg-success d-flex align-items-center gap-2 px-2 py-1">
        <span class="b-name"></span>
        <button type="button" class="b-rm btn-close btn-close-white" style="font-size:10px;"></button>
      </div>
    </template>

    <template id="tplRec">
      <div class="px-3 py-2 border-bottom">
        <div class="d-flex align-items-center mb-1">
          <span class="r-rank text-success fw-bold me-2" style="font-size:12px;"></span>
          <span class="r-name" style="font-size:13px;"></span>
        </div>
        <div class="progress" style="height:6px;">
          <div class="r-bar progress-bar bg-success" role="progressbar"></div>
        </div>
        <div class="text-end text-secondary mt-1" style="font-size:11px;">
          <span class="r-pct"></span>
        </div>
      </div>
    </template>

    <script src="../static/js/app.js">
 
    </script>

  </body>
</html>
